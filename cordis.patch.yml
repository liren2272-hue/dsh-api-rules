# ---------------------------------------------------------------------------
# DSH 侧的 provider 注册 —— 与上面同一个插件，跟随插件一起安装。
#
# 上面那段只提供 8788 上的规则层；下面这段把同一批 API 注册进 llm-pi-ai，
# 模型选择器里才会直接出现 codearts / officeace。这样换机器时只要装本插件，
# 就不必再手工改 profile 的 cordis.patch.yml。
#
# apiKeyEnv: API_RULES_BEARER —— 这是一条**占位** bearer（不是秘密）：pi-ai 只
# 用它确认「引用已配置」，真正的上游鉴权由本插件按路由注入。插件装载时会经
# lib/seed.mjs 自举写入这条引用（**只在缺失时写**，已有的值不动），所以新机器
# 装完插件就能直接用，不必手工编辑 .credentials.yaml。
#
# 补丁语义（见 dsh-base/cordis.patch.yml 头注释）：补丁按 id 定位整行、
# 「整块替换 config」而非深合并，后一层覆盖前一层。本插件在 bundles 里排在
# dsh-base 之后，所以这里改得到 llm-pi-ai；但用户 profile 的 cordis.patch.yml
# 又在所有 bundle 之后 —— 若某台机器的 profile 里已经有 `- id: llm-pi-ai`
# 并且写了 providers，则以 profile 那份为准，需要把下面两条 provider 也补进
# profile（本机 profile 已包含）。
# ---------------------------------------------------------------------------
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      # reasoningEfforts：模型选择器「思考强度」档位 → 上游 wire 值的映射。档位取自 pi-ai 的
      # THINKING_LEVELS（off/minimal/low/medium/high/xhigh/max）；只有声明了 reasoningEfforts 的
      # 模型，UI 上才会出现强度菜单（pi-ai 的 reasoningInfo() 对 reasoning=false 的模型返回 {}）。
      # 两个刻意的取舍：
      #   1. 一律不声明 off：用户不选档时 pi-ai 不下发 reasoning_effort，由上游用自己的默认值决定。
      #      一旦声明 off 为某个 wire 值，pi-ai 会在所有请求里强制带上它（openai 分支的 offValue 逻辑），
      #      把上游默认（思考开）改成显式关闭，行为会变。
      #   2. 上游的 "none"（= 关闭思考）不是 pi-ai 档位名，无法作为档位声明；要关闭思考请走 provider
      #      default，不要声明 off=none。glm-5.1 / kimi-k2.6 / deepseek-v4-flash 连 none 都不接受，
      #      声明了只会 400。
      # 每个模型的可取档位以本机实测为准（见各 provider 的探针注释）。
      codearts:
        apiKeyEnv: API_RULES_BEARER
        api: openai-completions
        baseURL: http://127.0.0.1:8788/v1
        models:
          - id: GLM-5.2
            name: GLM-5.2
            maxTokens: 65536
            # 华为 ModelArts 直连（无网关剥离）：[minimal, low, medium, high, xhigh, max]
            reasoningEfforts:
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: glm-5.2-sft-harmony
            name: GLM-5.2-SFT-Harmony
            maxTokens: 131072
            # 2026-11-08 实测（经 8788 codearts 路由）：low/medium/high/xhigh/max 全 200
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: openpangu-2.0-pro
            name: OpenPangu-2.0-Pro
            maxTokens: 131072
            # 2026-11-08 实测（经 8788 codearts 路由）：low/medium/high/xhigh/max 全 200
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: openpangu-2.0-flash
            name: OpenPangu-2.0-Flash
            maxTokens: 131072
            # 2026-11-08 实测（经 8788 codearts 路由）：low/medium/high/xhigh/max 全 200
            reasoningEfforts:
              low: low
              medium: medium
